# M13/U2: one heavy job at a time on this host — small heap, no parallel, no daemon.
# build_apk.sh also passes --no-daemon on the command line.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# Master change 2026-10-26: the launcher icon must be provably byte-for-byte the original
# game's icon. The release resource optimizer (AGP 8 default) rewrites resource paths
# (res/<short>.png), so keep normal res/mipmap-<density>-v4/ic_launcher.png entries that
# build_apk.sh can sha256 against `unzip -p` of the original APK. Safe: no shrinking here.
android.enableResourceOptimizations=false
